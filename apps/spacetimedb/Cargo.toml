[package]
name = "nva-spacetimedb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
wasm-coverage-runtime = ["dep:minicov"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app.workspace = true
domain.workspace = true
spacetimedb = "2"
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
minicov = { version = "0.3.9", optional = true }

[dev-dependencies]
trybuild.workspace = true
